[project]
name = "kgeval"
version = "0.1.1"
description = "An evaluation framework for knowledge graphs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "iamzices", email = "hello@zices.com" }
]
keywords = ["knowledge-graph", "neo4j", "evaluation", "graphrag", "rag", "retrieval", "data-quality", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "litellm>=1.110.3",
    "neo4j>=5.0",
    "openai>=1.92",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13",
    "tenacity>=9.2",
    "typer>=0.15.4",
]

[project.scripts]
kgeval = "kgeval.cli:app"

[project.urls]
Documentation = "https://kgeval.github.io/kgeval/"
Repository = "https://github.com/kgeval/kgeval"
Issues = "https://github.com/kgeval/kgeval/issues"

[dependency-groups]
dev = [
    "mypy (>=2.4.1,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "types-pyyaml (>=6.0.12)",
]
docs = [
    "mkdocs-material (>=9.8.2,<10.0.0)",
    "mkdocstrings[python] (>=1.0.8,<2.0.0)",
]

[tool.poetry.group.docs]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "BLE", "C4", "SIM", "PT", "T20", "RUF"]
# Enforce imperative summary lines, which the Google convention leaves off.
extend-select = ["D401"]
# Document constructor arguments in the class docstring, as Google style allows.
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Name tests after the behavior they check instead of documenting each test and helper.
"tests/**" = ["D101", "D102", "D103", "D105", "D107"]
# Let examples print their results.
"examples/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["integration: needs a disposable Neo4j database at KGEVAL_TEST_NEO4J_URI"]
filterwarnings = [
    "error",
    # Keep the filter LiteLLM sets on import, since pytest drops it after the importing test.
    "ignore:.*`ReadOnly` qualifier:UserWarning",
]
