name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pipx install poetry && poetry install
      - run: poetry check --lock
      - run: poetry run ruff check
      - run: poetry run ruff format --check
      - run: poetry run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: # Test the oldest supported Python, dependencies, and server, and the newest.
          - { python: "3.11", resolution: lowest-direct, server: "neo4j:5.10" }
          - { python: "3.x", resolution: highest, server: "neo4j:latest" }
    services:
      neo4j:
        image: ${{ matrix.server }}
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 5s
          --health-retries 30
    env:
      KGEVAL_TEST_NEO4J_URI: neo4j://localhost:7687
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pipx install poetry && pipx install uv && poetry install
      # Resolve with uv, since neither Poetry nor pip can install the lowest versions.
      - run: poetry run uv pip install --upgrade --resolution ${{ matrix.resolution }} .
      - run: poetry run pytest

  publish:
    if: github.event_name == 'release'
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry && poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1
